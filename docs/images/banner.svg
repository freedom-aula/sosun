<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="VIctory for macOS: an Xbox Series runtime on Apple Silicon, shown as a chip with three stacked layers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226"/>
      <stop offset="0.55" stop-color="#11203a"/>
      <stop offset="1" stop-color="#0d2f3a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e7f5"/>
      <stop offset="1" stop-color="#9d98c4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee0c2"/>
      <stop offset="1" stop-color="#4f8dff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <g transform="translate(150 200)">
    <g stroke="#b7b2dc" stroke-width="4" stroke-linecap="round">
      <path d="M-60 -95v-25M-30 -95v-25M0 -95v-25M30 -95v-25M60 -95v-25"/>
      <path d="M-60 95v25M-30 95v25M0 95v25M30 95v25M60 95v25"/>
      <path d="M-95 -60h-25M-95 -30h-25M-95 0h-25M-95 30h-25M-95 60h-25"/>
      <path d="M95 -60h25M95 -30h25M95 0h25M95 30h25M95 60h25"/>
    </g>
    <rect x="-95" y="-95" width="190" height="190" rx="26" fill="url(#chip)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="16" fill="#151233"/>
    <rect x="-44" y="-40" width="88" height="18" rx="6" fill="url(#glow)" opacity="0.55"/>
    <rect x="-44" y="-9" width="88" height="18" rx="6" fill="url(#glow)" opacity="0.8"/>
    <rect x="-44" y="22" width="88" height="18" rx="6" fill="url(#glow)"/>
  </g>
  <text x="330" y="175" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">VIctory <tspan fill="url(#glow)">for macOS</tspan></text>
  <text x="333" y="232" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#cfcbe8">An Xbox Series runtime on Apple Silicon, through Wine and Metal</text>
  <g font-family="Menlo, Consolas, monospace" font-size="20" fill="#e9e7f5">
    <rect x="333" y="270" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="423" y="296" text-anchor="middle">Apple Silicon</text>
    <rect x="527" y="270" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="622" y="296" text-anchor="middle">CrossOver Wine</text>
    <rect x="731" y="270" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="801" y="296" text-anchor="middle">D3DMetal</text>
    <rect x="885" y="270" width="110" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="940" y="296" text-anchor="middle">Rust</text>
  </g>
</svg>

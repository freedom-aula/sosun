# Compiles the argument clamp shader with Microsoft's compilers. Wine's HLSL
# compiler cannot build it, so the macOS port embeds this output through
# `cargo xtask embed-clamp`.
name: clamp bytecode

on:
  workflow_dispatch:
  push:
    paths:
      - crates/victory-gpu/src/clamp.hlsl
      - .github/workflows/clamp-bytecode.yml

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with FXC and DXC
        shell: pwsh
        run: |
          $kits = "C:\Program Files (x86)\Windows Kits\10\bin"
          $fxc = Get-ChildItem $kits -Recurse -Filter fxc.exe | Where-Object FullName -match '\\x64\\' | Sort-Object FullName | Select-Object -Last 1
          $dxc = Get-ChildItem $kits -Recurse -Filter dxc.exe | Where-Object FullName -match '\\x64\\' | Sort-Object FullName | Select-Object -Last 1
          Write-Host "fxc: $($fxc.FullName)"
          Write-Host "dxc: $($dxc.FullName)"
          New-Item -ItemType Directory -Force out | Out-Null
          & $fxc.FullName /nologo /T cs_5_1 /E main /Fo out/clamp.dxbc crates/victory-gpu/src/clamp.hlsl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $dxc.FullName -T cs_6_0 -E main -Fo out/clamp.dxil crates/victory-gpu/src/clamp.hlsl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: clamp-bytecode
          path: out/
